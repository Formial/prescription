<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formial Labs — Prescription Generator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap');
:root {
  --teal:  #1a4a42;
  --teal2: #2d7a6f;
  --teal3: #4aab9c;
  --sand:  #e8dcc8;
  --sand2: #f5f0e8;
  --cream: #fdfaf5;
  --ink:   #1c2220;
  --muted: #6b7c78;
  --r: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--cream);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 36px 16px 60px;
}
.wrap { width: 100%; max-width: 740px; }

/* HEADER — full green bar with real logo image */
.hdr {
  background: var(--teal);
  border-radius: 14px;
  padding: 18px 28px;
  box-shadow: 0 6px 24px rgba(26,74,66,0.22);
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
}
.hdr-logo { display: flex; align-items: center; }
.hdr-logo img {
  height: 44px;
  display: block;
  }
.hdr-info {
  border-left: 1px solid rgba(255,255,255,0.2);
  padding-left: 24px;
  text-align: right;
}
.hdr-info h1 {
  font-family: 'DM Serif Display', serif;
  font-size: 20px; color: #fff; font-weight: 400;
}
.hdr-info p { font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 4px; }

/* CARDS */
.card {
  background: #fff; border-radius: var(--r);
  border: 1px solid rgba(0,0,0,0.06);
  box-shadow: 0 2px 20px rgba(26,74,66,0.05);
  padding: 24px 28px; margin-bottom: 12px;
}
.card-title {
  font-size: 9px; font-weight: 700; letter-spacing: 1.8px;
  text-transform: uppercase; color: var(--teal2);
  margin-bottom: 16px; padding-bottom: 10px;
  border-bottom: 1px solid var(--sand);
}
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 22px; }
.fg { display: flex; flex-direction: column; gap: 5px; }
label { font-size: 9px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted); }
input, select, textarea {
  font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--ink);
  background: var(--sand2); border: 1.5px solid transparent;
  border-radius: 8px; padding: 9px 12px; outline: none;
  transition: border-color .2s, box-shadow .2s; width: 100%;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--teal3);
  box-shadow: 0 0 0 3px rgba(74,171,156,.15);
  background: #fff;
}
textarea { resize: vertical; min-height: 70px; line-height: 1.6; }
.hint { font-size: 11px; color: var(--muted); margin-top: 5px; line-height: 1.5; }

/* MED ROWS */
#med-rows { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.med-row { display: grid; grid-template-columns: 2fr 1fr 34px; gap: 8px; align-items: start; }
.med-manual { margin-top: 6px; display: none; }
.med-manual.on { display: block; }
.btn-rm {
  background: none; border: 1.5px solid #ddd; border-radius: 6px;
  color: #bbb; width: 34px; height: 38px; cursor: pointer; font-size: 18px;
  display: flex; align-items: center; justify-content: center; transition: all .2s; flex-shrink: 0;
}
.btn-rm:hover { border-color: #d00; color: #d00; }
.btn-add {
  background: none; border: 1.5px dashed var(--teal3); border-radius: 8px;
  color: var(--teal2); font-family: 'DM Sans', sans-serif; font-size: 13px;
  font-weight: 500; padding: 7px 12px; cursor: pointer; transition: all .2s; width: 100%;
}
.btn-add:hover { background: rgba(74,171,156,.07); }

/* SETUP CARD */
.setup-card {
  border: 1px dashed var(--teal3);
  background: var(--sand2);
  box-shadow: none;
  margin-bottom: 12px;
}
.setup-summary {
  cursor: pointer; list-style: none;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 0; padding-bottom: 0; border-bottom: none;
  user-select: none;
}
.setup-summary::-webkit-details-marker { display: none; }
details[open] .setup-summary { border-bottom: 1px solid var(--sand); padding-bottom: 10px; margin-bottom: 0; }
.setup-arrow { font-size: 10px; color: var(--teal3); transition: transform 0.2s; }
details[open] .setup-arrow { transform: rotate(180deg); }

/* GENERATE BUTTON */
.btn-gen {
  width: 100%; padding: 15px; background: var(--teal); color: #fff;
  border: none; border-radius: var(--r);
  font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600;
  cursor: pointer; transition: all .2s;
  display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 6px;
  box-shadow: 0 4px 14px rgba(26,74,66,0.3);
}
.btn-gen:hover { background: var(--teal2); transform: translateY(-1px); }
.btn-gen:active { transform: translateY(0); }
.btn-gen:disabled { opacity: .5; cursor: not-allowed; transform: none; }
#status { text-align: center; font-size: 13px; margin-top: 10px; color: var(--teal2); min-height: 18px; }
#status.err { color: #c0392b; }
</style>
</head>

let rowIdx = 1;

window.addEventListener('DOMContentLoaded', () => {
  const s = localStorage.getItem('formial_rx_sheet');
  if (s) document.getElementById('sheetUrl').value = s;
  document.getElementById('rxDate').valueAsDate = new Date();
});

document.getElementById('sheetUrl').addEventListener('input', e => {
  if (e.target.value.trim()) localStorage.setItem('formial_rx_sheet', e.target.value.trim());
});

function onMedSel(sel) {
  const idx = sel.closest('.med-row').dataset.idx;
  const m = document.getElementById('man-' + idx);
  if (m) m.classList.toggle('on', sel.value === '__manual');
}

function addMed() {
  const idx = rowIdx++;
  const row = document.createElement('div');
  row.className = 'med-row'; row.dataset.idx = idx;
  row.innerHTML = `
    <select class="med-sel" onchange="onMedSel(this)">
      <option value="">Select medicine&hellip;</option>
      <option>Cap Doxycycline (Doxt-SL) 100 mg</option>
      <option>Cap Isotretinoin (Sotret) 10 mg</option>
      <option>Cap Isotretinoin (Sotret) 20 mg</option>
      <option value="__manual">Type manually&hellip;</option>
    </select>
    <select class="freq-sel">
      <option value="">Frequency</option>
      <option value="once daily">Once daily</option>
      <option value="twice daily">Twice daily</option>
    </select>
    <button class="btn-rm" onclick="rmMed(this)">&times;</button>`;
  const man = document.createElement('div');
  man.className = 'med-manual'; man.id = 'man-' + idx;
  man.innerHTML = `<input type="text" placeholder="Type medicine / instruction&hellip;" />`;
  document.getElementById('med-rows').append(row, man);
}

function rmMed(btn) {
  const row = btn.closest('.med-row');
  const idx = row.dataset.idx;
  const man = document.getElementById('man-' + idx);
  if (document.querySelectorAll('.med-row').length === 1) {
    row.querySelector('.med-sel').value = '';
    row.querySelector('.freq-sel').value = '';
    if (man) { man.classList.remove('on'); man.querySelector('input').value = ''; }
    return;
  }
  row.remove(); if (man) man.remove();
}

function getMeds() {
  const out = [];
  document.querySelectorAll('.med-row').forEach(row => {
    const idx = row.dataset.idx;
    const sel = row.querySelector('.med-sel');
    const freq = row.querySelector('.freq-sel').value;
    let name = sel.value === '__manual'
      ? (document.getElementById('man-' + idx)?.querySelector('input').value.trim() || '')
      : sel.value;
    if (!name) return;
    out.push(freq ? name + ' \u2014 ' + freq : name);
  });
  return out;
}

function setStatus(msg, err) {
  const el = document.getElementById('status');
  el.textContent = msg; el.className = err ? 'err' : '';
}

async function generate() {
  const name     = document.getElementById('patName').value.trim();
  const age      = document.getElementById('age').value.trim();
  const gender   = document.getElementById('gender').value;
  const dateVal  = document.getElementById('rxDate').value;
  const notes    = document.getElementById('notes').value.trim();
  const sheetUrl = document.getElementById('sheetUrl').value.trim();
  const meds     = getMeds();

  if (!name)        { setStatus('Please enter patient name.', true); return; }
  if (!dateVal)     { setStatus('Please select a date.', true); return; }
  if (!meds.length) { setStatus('Please add at least one medicine.', true); return; }

  if (sheetUrl) localStorage.setItem('formial_rx_sheet', sheetUrl);
  const [y, mo, d] = dateVal.split('-');
  const dispDate = `${d}-${mo}-${y}`;

  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  setStatus('Saving to sheet\u2026');

  await logSheet({ name, age, gender, date: dispDate, meds, notes, sheetUrl });

  try {
    buildPDF({ name, age, gender, dispDate, meds, notes });
    setStatus('\u2713 PDF downloaded!' + (sheetUrl ? '  Logged to sheet.' : ''));
  } catch(e) {
    setStatus('Error generating PDF: ' + e.message, true);
    console.error(e);
  }
  btn.disabled = false;
}

async function logSheet({ name, age, gender, date, meds, notes, sheetUrl }) {
  if (!sheetUrl || !sheetUrl.startsWith('http')) return;
  const payload = JSON.stringify({
    date,
    name,
    age,
    gender,
    medicines: meds.join(' | '),
    notes: notes || ''
  });
  try {
    // text/plain avoids CORS preflight — body still arrives as e.postData.contents
    await fetch(sheetUrl, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: payload
    });
  } catch(e) {
    console.warn('Sheet log failed:', e);
  }
}

function buildPDF({ name, age, gender, dispDate, meds, notes }) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, H = 297, ML = 18, MR = 18, CW = W - ML - MR;

  const C = {
    teal:  [26,  74,  66],
    teal2: [45,  122, 111],
    teal3: [74,  171, 156],
    sand:  [232, 220, 200],
    sand2: [248, 244, 238],
    ink:   [28,  34,  32],
    muted: [107, 124, 120],
    white: [255, 255, 255],
    ltgreen: [243, 249, 247],
  };

  // ── HEADER ──────────────────────────────────────────────────────────────
  doc.setFillColor(...C.teal);
  doc.rect(0, 0, W, 50, 'F');

  // Subtle dark accent triangle top-right
  doc.setFillColor(20, 58, 52);
  doc.triangle(W, 0, W, 50, W - 55, 0, 'F');

  // Logo image — mix-blend won't work in PDF, so we render on the teal bg directly
  // The logo JPEG has black bg — we place it and use 'NONE' blending; 
  // instead crop: render only the white parts via luminosity — not possible in jsPDF
  // Best approach: place logo at left, it will show with its black bg as a contained box
  // To make it look good: put a slightly lighter teal rect behind it so it feels intentional
  const logoW = 68, logoH = Math.round(68 * 502/1800);
  const logoX = ML, logoY = (50 - logoH) / 2;

  try {
    doc.addImage('data:image/png;base64,' + LOGO_B64, 'PNG', logoX, logoY, logoW, logoH);
  } catch(e) {
    doc.setFont('times','italic'); doc.setFontSize(24); doc.setTextColor(...C.white);
    doc.text('formial', logoX + 4, logoY + logoH - 4);
  }

  // Doctor info — right side of header
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(11.5); doc.setTextColor(...C.white);
  doc.text('Dr. Neha Fogla', W - MR, 20, { align: 'right' });
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8); doc.setTextColor(200, 230, 226);
  doc.text('MBBS, MD (DVL)  \u00b7  Dermatologist', W - MR, 27, { align: 'right' });
  doc.setFontSize(7.5); doc.setTextColor(160, 210, 205);
  doc.text('MMC Reg. No. 2021054683', W - MR, 34, { align: 'right' });

  // ── PATIENT ROW ──────────────────────────────────────────────────────────
  let cy = 58;

  // Rx symbol — left, smaller, not overlapping name
  doc.setFont('times', 'bolditalic');
  doc.setFontSize(28); doc.setTextColor(...C.teal3);
  doc.text('Rx', ML, cy + 8);

  // Thin vertical separator after Rx
  doc.setDrawColor(...C.teal3); doc.setLineWidth(0.4);
  doc.line(ML + 14, cy - 1, ML + 14, cy + 11);

  // Patient name — clearly to the right of the separator
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(16); doc.setTextColor(...C.ink);
  doc.text(name, ML + 19, cy + 5);

  // Age / gender
  const ageLine = [age && ('Age ' + age), gender || ''].filter(Boolean).join('   \u00b7   ');
  if (ageLine) {
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8.5); doc.setTextColor(...C.muted);
    doc.text(ageLine, ML + 19, cy + 12);
  }

  // Date — right aligned
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(7); doc.setTextColor(...C.muted);
  doc.text('DATE', W - MR, cy + 4, { align: 'right' });
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(10); doc.setTextColor(...C.teal);
  doc.text(dispDate, W - MR, cy + 12, { align: 'right' });

  cy += 22;

  // Full-width divider
  doc.setDrawColor(...C.teal3); doc.setLineWidth(0.5);
  doc.line(ML, cy, W - MR, cy);

  cy += 10;

  // ── PRESCRIBED SECTION ───────────────────────────────────────────────────
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(7); doc.setTextColor(...C.teal2);
  doc.setCharSpace(2.5); doc.text('PRESCRIBED', ML, cy); doc.setCharSpace(0);
  cy += 7;

  meds.forEach((med, i) => {
    const lines = doc.splitTextToSize(med, CW - 16);
    const rowH = Math.max(lines.length * 6.5 + 12, 18);

    if (i % 2 === 0) {
      doc.setFillColor(...C.ltgreen);
      doc.roundedRect(ML, cy - 4, CW, rowH, 2, 2, 'F');
    }

    // Number badge
    doc.setFillColor(...C.teal);
    doc.roundedRect(ML + 2, cy - 2.5, 8, 8, 1.5, 1.5, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(6.5);
    doc.setTextColor(...C.white);
    doc.text(String(i + 1), ML + 6, cy + 3, { align: 'center' });

    // Med text
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(11); doc.setTextColor(...C.ink);
    doc.text(lines, ML + 14, cy + 4);

    cy += rowH + 5;
  });

  // ── NOTES — small, at bottom above signature ──────────────────────────────
  const sigY = H - 95; // where signature block starts

  if (notes) {
    // Place notes just above the signature — calculate from bottom up
    const nl = doc.splitTextToSize(notes, CW - 8);
    const notesH = nl.length * 4.8 + 10;
    const notesY = sigY - notesH - 10;

    // Only draw if there's enough space (doesn't overlap prescriptions)
    if (notesY > cy + 6) {
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(6); doc.setTextColor(...C.muted);
      doc.setCharSpace(1.5); doc.text('NOTES', ML, notesY); doc.setCharSpace(0);

      doc.setFont('helvetica', 'italic');
      doc.setFontSize(8); doc.setTextColor(...C.muted);
      doc.text(nl, ML, notesY + 7);

      // Light underline above notes
      doc.setDrawColor(...C.sand); doc.setLineWidth(0.3);
      doc.line(ML, notesY - 4, W - MR, notesY - 4);
    }
  }

  // ── SIGNATURE BLOCK ───────────────────────────────────────────────────────
  // Signature image
  const sigImgW = 46, sigImgH = Math.round(46 * 224/872);
  try {
    doc.addImage('data:image/png;base64,' + SIG_B64, 'PNG', ML, sigY, sigImgW, sigImgH);
  } catch(e) {}

  // Name & credentials below sig
  const credY = sigY + sigImgH + 4;
  doc.setDrawColor(...C.sand); doc.setLineWidth(0.25);
  doc.line(ML, credY, ML + 58, credY);

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(10); doc.setTextColor(...C.teal);
  doc.text('Dr. Neha Fogla', ML, credY + 7);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(7.5); doc.setTextColor(...C.muted);
  doc.text('MBBS, MD (DVL)  \u00b7  Dermatologist', ML, credY + 13);

  // Seal
  const sx = W - MR - 22, scy = sigY + 18;
  doc.setDrawColor(...C.teal3); doc.setLineWidth(0.6);
  doc.circle(sx, scy, 16);
  doc.setLineWidth(0.25); doc.circle(sx, scy, 14);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(5.5);
  doc.setTextColor(...C.teal2); doc.setCharSpace(1.5);
  doc.text('FORMIAL', sx, scy - 2, { align: 'center' });
  doc.text('LABS', sx, scy + 4, { align: 'center' });
  doc.setCharSpace(0);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(5); doc.setTextColor(...C.teal3);
  doc.text('BENGALURU', sx, scy + 9, { align: 'center' });

  // ── FOOTER ────────────────────────────────────────────────────────────────
  const fy = H - 16;
  doc.setFillColor(...C.teal); doc.rect(0, fy, W, 16, 'F');
  doc.setFillColor(20, 58, 52); doc.triangle(0, fy, 30, fy, 0, H, 'F');

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(6.5); doc.setTextColor(175, 210, 205);
  doc.text('1ST FLOOR, 181, KBAR ROAD, AUSTIN TOWN, BENGALURU \u2013 560047', W/2, fy + 6, { align: 'center' });
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(7); doc.setTextColor(...C.white);
  doc.text('+91\u00a087928\u00a008844   \u00b7   care@formial.in', W/2, fy + 12, { align: 'center' });

  doc.save('Rx_' + name.replace(/\s+/g,'_') + '_' + dispDate.replace(/-/g,'') + '.pdf');
}
</script>
