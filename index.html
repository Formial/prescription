<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formial Labs — Prescription Generator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap');
:root {
  --teal:  #1a4a42;
  --teal2: #2d7a6f;
  --teal3: #4aab9c;
  --sand:  #e8dcc8;
  --sand2: #f5f0e8;
  --cream: #fdfaf5;
  --ink:   #1c2220;
  --muted: #6b7c78;
  --r:     12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--cream);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 36px 16px 60px;
}
.wrap { width: 100%; max-width: 740px; }
.hdr { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
.hdr-logo {
  background: var(--teal);
  padding: 8px 16px; border-radius: 8px;
  display: flex; align-items: center;
}
.wrap { width: 100%; max-width: 740px; }
.hdr { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
.hdr-logo {
  background: var(--teal); color: #fff;
  font-family: 'DM Serif Display', serif;
  font-size: 17px; letter-spacing: 2px;
  padding: 9px 16px; border-radius: 8px;
}
.hdr-logo span { color: var(--teal3); }
.hdr h1 { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--teal); font-weight: 400; }
.hdr p  { font-size: 12px; color: var(--muted); margin-top: 2px; }
.card {
  background: #fff; border-radius: var(--r);
  border: 1px solid rgba(0,0,0,0.07);
  box-shadow: 0 2px 18px rgba(26,74,66,0.06);
  padding: 28px 32px; margin-bottom: 16px;
}
  font-size: 10px; font-weight: 600; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--teal2);
  margin-bottom: 20px; padding-bottom: 10px;
  border-bottom: 1px solid var(--sand);
}
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; }
.fg { display: flex; flex-direction: column; gap: 5px; }
label { font-size: 10px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted); }
input, select, textarea {
  font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--ink);
  background: var(--sand2); border: 1.5px solid transparent;
  border-radius: 8px; padding: 9px 12px; outline: none;
  transition: border-color .2s, box-shadow .2s; width: 100%;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--teal3);
  box-shadow: 0 0 0 3px rgba(74,171,156,.15);
  background: #fff;
}
textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
#med-rows { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.med-row {
  display: grid;
  grid-template-columns: 2fr 1fr 36px;
  gap: 8px;
  align-items: center;
}
.med-row input, .med-row select { margin: 0; }
.btn-rm {
  background: none; border: 1.5px solid #ddd; border-radius: 6px;
  color: #aaa; width: 36px; height: 36px; cursor: pointer; font-size: 18px;
  display: flex; align-items: center; justify-content: center; transition: all .2s;
  flex-shrink: 0;
}
.btn-rm:hover { border-color: #d00; color: #d00; }
.btn-add {
  background: none; border: 1.5px dashed var(--teal3); border-radius: 8px;
  color: var(--teal2); font-family: 'DM Sans', sans-serif; font-size: 13px;
  font-weight: 500; padding: 7px 12px; cursor: pointer; transition: all .2s; width: 100%;
}
.btn-add:hover { background: rgba(74,171,156,.08); }
.btn-gen {
  width: 100%; padding: 15px; background: var(--teal); color: #fff;
  border: none; border-radius: var(--r);
  font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600;
  cursor: pointer; transition: background .2s, opacity .2s;
  display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 6px;
}
.btn-gen:hover { background: var(--teal2); }
.btn-gen:disabled { opacity: .5; cursor: not-allowed; }
#status { text-align: center; font-size: 13px; margin-top: 10px; color: var(--teal2); min-height: 18px; }
#status.err { color: #c0392b; }
.hint { font-size: 11px; color: var(--muted); margin-top: 5px; line-height: 1.5; }
.med-manual-row { display: none; margin-top: 6px; }
.med-manual-row.visible { display: block; }
</style>
</head>
<body>
<div class="wrap">

  <div class="hdr">
    <div class="hdr-logo">form<span>ial</span></div>
    <div>
      <h1>Prescription Generator</h1>
      <p>Dr. Neha Fogla &middot; MBBS MD (DVL) &middot; MMC Reg. 2021054683</p>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Google Sheets &mdash; One-time Setup</div>
    <div class="fg">
      <label>Apps Script Web App URL</label>
      <input type="url" id="sheetUrl" placeholder="https://script.google.com/macros/s/&hellip;/exec" />
      <div class="hint">Paste your Web App URL once &mdash; saved in your browser automatically.</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Patient Details</div>
    <div class="grid2">
      <div class="fg">
        <label>Patient Name</label>
        <input type="text" id="patName" placeholder="e.g. Prachi Redkar" />
      </div>
      <div class="fg">
        <label>Gender</label>
        <select id="gender">
          <option value="">Select</option>
          <option>Male</option><option>Female</option><option>Other</option>
        </select>
      </div>
      <div class="fg">
        <label>Age</label>
        <input type="text" id="age" placeholder="e.g. 26" />
      </div>
      <div class="fg">
        <label>Date</label>
        <input type="date" id="rxDate" />
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Medicines / Instructions</div>
    <div id="med-rows">
      <div class="med-row" data-idx="0">
        <select class="med-select" onchange="handleMedSelect(this)">
          <option value="">Select medicine&hellip;</option>
          <option value="Cap Doxycycline (Doxt-SL) 100 mg">Cap Doxycycline (Doxt-SL) 100 mg</option>
          <option value="Cap Isotretinoin (Sotret) 10 mg">Cap Isotretinoin (Sotret) 10 mg</option>
          <option value="Cap Isotretinoin (Sotret) 20 mg">Cap Isotretinoin (Sotret) 20 mg</option>
          <option value="manual">Type manually&hellip;</option>
        </select>
        <select class="freq-select">
          <option value="">Frequency</option>
          <option value="once daily">Once daily</option>
          <option value="twice daily">Twice daily</option>
        </select>
        <button class="btn-rm" onclick="rmMed(this)">&times;</button>
      </div>
      <div class="med-manual-row" id="manual-0">
        <input type="text" class="med-manual-input" placeholder="Type medicine / instruction&hellip;" />
      </div>
    </div>
    <button class="btn-add" onclick="addMed()">+ Add line</button>
  </div>

  <div class="card">
    <div class="card-title">Additional Notes <span style="font-weight:300;text-transform:none;letter-spacing:0">(optional)</span></div>
    <div class="fg">
      <textarea id="notes" placeholder="Follow-up in 4 weeks, avoid sun exposure, etc."></textarea>
    </div>
  </div>

  <button class="btn-gen" id="genBtn" onclick="generate()">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="12" y1="18" x2="12" y2="12"/>
      <line x1="9" y1="15" x2="15" y2="15"/>
    </svg>
    Generate &amp; Download PDF
  </button>
  <div id="status"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>

let rowIdx = 1;

window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('formial_rx_sheet');
  if (saved) document.getElementById('sheetUrl').value = saved;
  document.getElementById('rxDate').valueAsDate = new Date();
});
document.getElementById('sheetUrl').addEventListener('input', () => {
  const v = document.getElementById('sheetUrl').value.trim();
  if (v) localStorage.setItem('formial_rx_sheet', v);
});

function handleMedSelect(sel) {
  const row = sel.closest('.med-row');
  const idx = row.dataset.idx;
  const manualRow = document.getElementById('manual-' + idx);
  if (sel.value === 'manual') {
    manualRow.classList.add('visible');
  } else {
    manualRow.classList.remove('visible');
  }
}

function addMed() {
  const idx = rowIdx++;
  const rowDiv = document.createElement('div');
  rowDiv.className = 'med-row';
  rowDiv.dataset.idx = idx;
  rowDiv.innerHTML = `
    <select class="med-select" onchange="handleMedSelect(this)">
      <option value="">Select medicine&hellip;</option>
      <option value="Cap Doxycycline (Doxt-SL) 100 mg">Cap Doxycycline (Doxt-SL) 100 mg</option>
      <option value="Cap Isotretinoin (Sotret) 10 mg">Cap Isotretinoin (Sotret) 10 mg</option>
      <option value="Cap Isotretinoin (Sotret) 20 mg">Cap Isotretinoin (Sotret) 20 mg</option>
      <option value="manual">Type manually&hellip;</option>
    </select>
    <select class="freq-select">
      <option value="">Frequency</option>
      <option value="once daily">Once daily</option>
      <option value="twice daily">Twice daily</option>
    </select>
    <button class="btn-rm" onclick="rmMed(this)">&times;</button>`;
  const manualDiv = document.createElement('div');
  manualDiv.className = 'med-manual-row';
  manualDiv.id = 'manual-' + idx;
  manualDiv.innerHTML = `<input type="text" class="med-manual-input" placeholder="Type medicine / instruction&hellip;" />`;
  document.getElementById('med-rows').appendChild(rowDiv);
  document.getElementById('med-rows').appendChild(manualDiv);
}

function rmMed(btn) {
  const row = btn.closest('.med-row');
  const idx = row.dataset.idx;
  const manualRow = document.getElementById('manual-' + idx);
  const allRows = document.querySelectorAll('.med-row');
  if (allRows.length === 1) {
    // reset instead of remove
    row.querySelector('.med-select').value = '';
    row.querySelector('.freq-select').value = '';
    if (manualRow) { manualRow.classList.remove('visible'); manualRow.querySelector('input').value = ''; }
    return;
  }
  row.remove();
  if (manualRow) manualRow.remove();
}

function getMeds() {
  const meds = [];
  document.querySelectorAll('.med-row').forEach(row => {
    const idx = row.dataset.idx;
    const sel = row.querySelector('.med-select');
    const freq = row.querySelector('.freq-select').value;
    let medName = '';
    if (sel.value === 'manual') {
      const manualInput = document.getElementById('manual-' + idx);
      medName = manualInput ? manualInput.querySelector('input').value.trim() : '';
    } else {
      medName = sel.value;
    }
    if (!medName) return;
    const line = freq ? medName + ' — ' + freq : medName;
    meds.push(line);
  });
  return meds;
}

function setStatus(msg, err) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = err ? 'err' : '';
}

async function generate() {
  const name     = document.getElementById('patName').value.trim();
  const age      = document.getElementById('age').value.trim();
  const gender   = document.getElementById('gender').value;
  const dateVal  = document.getElementById('rxDate').value;
  const notes    = document.getElementById('notes').value.trim();
  const sheetUrl = document.getElementById('sheetUrl').value.trim();
  const meds     = getMeds();

  if (!name)        { setStatus('Please enter patient name.', true); return; }
  if (!dateVal)     { setStatus('Please select a date.', true); return; }
  if (!meds.length) { setStatus('Please add at least one medicine.', true); return; }

  if (sheetUrl) localStorage.setItem('formial_rx_sheet', sheetUrl);

  const [y,m,d] = dateVal.split('-');
  const dispDate = `${d}-${m}-${y}`;

  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  setStatus('Generating…');

  try {
    buildPDF({ name, age, gender, dispDate, meds, notes });
    logSheet({ name, age, gender, date: dispDate, meds, notes, sheetUrl });
    setStatus('\u2713 PDF downloaded!' + (sheetUrl ? '  Logged to sheet.' : ''));
  } catch(e) {
    setStatus('Error: ' + e.message, true);
    console.error(e);
  }
  btn.disabled = false;
}

function logSheet({ name, age, gender, date, meds, notes, sheetUrl }) {
  if (!sheetUrl || !sheetUrl.startsWith('http')) return;
  const p = new URLSearchParams({ name, age, gender, date, medicines: meds.join(' | '), notes });
  const s = document.createElement('script');
  s.src = sheetUrl + '?' + p.toString();
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 6000);
}

function buildPDF({ name, age, gender, dispDate, meds, notes }) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, H = 297, ML = 18, MR = 18, CW = W - ML - MR;

  const C = {
    teal:  [26,74,66], teal3: [74,171,156],
    sand:  [232,220,200], sand2: [245,240,232],
    ink:   [28,34,32], muted: [107,124,120],
  };

  // ── Header: full-width teal band ──
  const BAND_H = 36;
  doc.setFillColor(...C.teal);
  doc.rect(0, 0, W, BAND_H, 'F');

  // Sand corner accents
  doc.setFillColor(232, 220, 200);
  doc.triangle(0, BAND_H, 28, 0, 0, 0, 'F');
  doc.triangle(W, BAND_H, W - 28, 0, W, 0, 'F');

  // Formial Labs logo image centered in the band
  // Logo is black on black bg — use white version by embedding and setting blend
  // We embed the actual logo image
  const logoW = 52;
  const logoH = 14;
  const logoX = (W - logoW) / 2;
  const logoY = (BAND_H - logoH) / 2;
  doc.addImage('data:image/jpeg;base64,' + LOGO_B64, 'JPEG', logoX, logoY, logoW, logoH);

  // ── doctor block ──
  let cy = 42;
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(13);
  doc.setTextColor(...C.teal);
  doc.text('Dr. Neha Fogla', ML, cy);

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8.5);
  doc.setTextColor(...C.muted);
  cy += 5.5; doc.text('MBBS, MD (DVL)', ML, cy);
  cy += 4.5; doc.text('MMC Reg. No. 2021054683', ML, cy);

  cy += 5;
  doc.setDrawColor(...C.teal3); doc.setLineWidth(0.4);
  doc.line(ML, cy, W-MR, cy);

  // ── Rx + date ──
  cy += 10;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(22); doc.setTextColor(...C.teal);
  doc.text('Rx', ML, cy);

  doc.setFontSize(8); doc.setFont('helvetica', 'normal'); doc.setTextColor(...C.muted);
  doc.text('Date', W-MR-28, cy-3);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(...C.ink);
  doc.text(dispDate, W-MR, cy-3, { align: 'right' });

  // ── patient ──
  cy += 8;
  doc.setFontSize(8.5); doc.setFont('helvetica', 'normal'); doc.setTextColor(...C.muted);
  doc.text('Patient', ML+12, cy);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(...C.ink);
  doc.text(name, ML+34, cy);
  const ageLine = [age&&`Age: ${age}`, gender&&`Gender: ${gender}`].filter(Boolean).join('   \u00b7   ');
  if (ageLine) {
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...C.muted);
    doc.text(ageLine, ML+34, cy+5.5);
  }

  // ── divider ──
  cy += 14;
  doc.setDrawColor(...C.sand); doc.setLineWidth(0.3);
  doc.line(ML, cy, W-MR, cy);

  // ── medicines ──
  cy += 10;
  meds.forEach((med, i) => {
    doc.setFillColor(...C.teal3);
    doc.circle(ML+2, cy-1.5, 1.2, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...C.teal);
    doc.text(`${i+1}.`, ML+6, cy);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5); doc.setTextColor(...C.ink);
    const lines = doc.splitTextToSize(med, CW-18);
    doc.text(lines, ML+14, cy);
    cy += lines.length * 6.5 + 5;
  });

  cy += 10;

  // ── notes ──
  if (notes) {
    const nl = doc.splitTextToSize(notes, CW-18);
    const nh = nl.length * 5.5 + 14;
    doc.setFillColor(...C.sand2);
    doc.roundedRect(ML, cy, CW, nh, 3, 3, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5); doc.setTextColor(...C.teal);
    doc.text('NOTES', ML+8, cy+7);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(...C.ink);
    doc.text(nl, ML+8, cy+13);
    cy += nh + 6;
  }

  // ── signature ──
  const sy = Math.max(cy + 10, H - 72);
  doc.addImage('data:image/png;base64,' + SIG_B64, 'PNG', ML, sy, 42, 14);

  doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(...C.teal);
  doc.text('Dr. Neha Fogla', ML, sy + 20);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...C.muted);
  doc.text('MBBS, MD (DVL)', ML, sy + 26);

  // ── footer ──
  const fy = H - 22;
  doc.setFillColor(...C.sand2); doc.rect(0, fy, W, 22, 'F');
  doc.setFillColor(...C.teal); doc.triangle(W-38, H, W, H-26, W, H, 'F');
  doc.setFillColor(...C.sand); doc.triangle(W-20, H, W, H-14, W, H, 'F');
  doc.setFontSize(7.5); doc.setFont('helvetica', 'normal'); doc.setTextColor(...C.muted);
  doc.text('REG OFFICE: 1ST FLOOR, 181, KBAR ROAD, AUSTIN TOWN, BANGALORE \u2013 560047', ML, fy+7);
  doc.text('+91 87928 08844   \u00b7   care@formial.in', ML, fy+14);

  doc.save(`Prescription_${name.replace(/\s+/g,'_')}_${dispDate.replace(/-/g,'')}.pdf`);
}
</script>
</body>
</html>
