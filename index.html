<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formial Labs — Prescription Generator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap');
:root {
  --teal:  #1a4a42;
  --teal2: #2d7a6f;
  --teal3: #4aab9c;
  --sand:  #e8dcc8;
  --sand2: #f5f0e8;
  --cream: #fdfaf5;
  --ink:   #1c2220;
  --muted: #6b7c78;
  --r: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--cream);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 36px 16px 60px;
}
.wrap { width: 100%; max-width: 740px; }
.hdr { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; }
.hdr-logo {
  background: var(--teal);
  padding: 10px 18px; border-radius: 10px;
  display: flex; flex-direction: column; align-items: center;
  box-shadow: 0 4px 16px rgba(26,74,66,0.25);
}
.logo-word {
  font-family: 'DM Serif Display', serif;
  font-style: italic;
  font-size: 24px; color: #fff; letter-spacing: 0.5px; line-height: 1;
}
.logo-word span { color: var(--teal3); }
.logo-labs {
  font-size: 6.5px; font-weight: 600; letter-spacing: 5px;
  color: var(--sand); text-transform: uppercase; margin-top: 2px;
}
.hdr-info h1 {
  font-family: 'DM Serif Display', serif;
  font-size: 21px; color: var(--teal); font-weight: 400;
}
.hdr-info p { font-size: 12px; color: var(--muted); margin-top: 3px; }
.card {
  background: #fff; border-radius: var(--r);
  border: 1px solid rgba(0,0,0,0.06);
  box-shadow: 0 2px 20px rgba(26,74,66,0.05);
  padding: 26px 30px; margin-bottom: 14px;
}
.card-title {
  font-size: 9.5px; font-weight: 700; letter-spacing: 1.8px;
  text-transform: uppercase; color: var(--teal2);
  margin-bottom: 18px; padding-bottom: 10px;
  border-bottom: 1px solid var(--sand);
}
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 22px; }
.fg { display: flex; flex-direction: column; gap: 5px; }
label { font-size: 9.5px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted); }
input, select, textarea {
  font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--ink);
  background: var(--sand2); border: 1.5px solid transparent;
  border-radius: 8px; padding: 9px 12px; outline: none;
  transition: border-color .2s, box-shadow .2s; width: 100%;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--teal3);
  box-shadow: 0 0 0 3px rgba(74,171,156,.15);
  background: #fff;
}
textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
.hint { font-size: 11px; color: var(--muted); margin-top: 5px; line-height: 1.5; }
#med-rows { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.med-row { display: grid; grid-template-columns: 2fr 1fr 34px; gap: 8px; align-items: start; }
.med-manual { margin-top: 6px; display: none; }
.med-manual.on { display: block; }
.btn-rm {
  background: none; border: 1.5px solid #ddd; border-radius: 6px;
  color: #bbb; width: 34px; height: 38px; cursor: pointer; font-size: 18px;
  display: flex; align-items: center; justify-content: center; transition: all .2s; flex-shrink: 0;
}
.btn-rm:hover { border-color: #d00; color: #d00; }
.btn-add {
  background: none; border: 1.5px dashed var(--teal3); border-radius: 8px;
  color: var(--teal2); font-family: 'DM Sans', sans-serif; font-size: 13px;
  font-weight: 500; padding: 7px 12px; cursor: pointer; transition: all .2s; width: 100%;
}
.btn-add:hover { background: rgba(74,171,156,.07); }
.btn-gen {
  width: 100%; padding: 15px; background: var(--teal); color: #fff;
  border: none; border-radius: var(--r);
  font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600;
  cursor: pointer; transition: all .2s;
  display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 6px;
  box-shadow: 0 4px 14px rgba(26,74,66,0.3);
}
.btn-gen:hover { background: var(--teal2); transform: translateY(-1px); }
.btn-gen:active { transform: translateY(0); }
.btn-gen:disabled { opacity: .5; cursor: not-allowed; transform: none; }
#status { text-align: center; font-size: 13px; margin-top: 10px; color: var(--teal2); min-height: 18px; }
#status.err { color: #c0392b; }
</style>
</head>
<body>
<div class="wrap">

  <div class="hdr">
    <div class="hdr-logo">
      <div class="logo-word">form<span>ial</span></div>
      <div class="logo-labs">LABS</div>
    </div>
    <div class="hdr-info">
      <h1>Prescription Generator</h1>
      <p>Dr. Neha Fogla &middot; MBBS MD (DVL) &middot; MMC Reg. 2021054683</p>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Google Sheets &mdash; One-time Setup</div>
    <div class="fg">
      <label>Apps Script Web App URL</label>
      <input type="url" id="sheetUrl" placeholder="https://script.google.com/macros/s/&hellip;/exec" />
      <div class="hint">Paste your Web App URL once &mdash; saved in your browser automatically.</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Patient Details</div>
    <div class="grid2">
      <div class="fg"><label>Patient Name</label><input type="text" id="patName" placeholder="e.g. Prachi Redkar" /></div>
      <div class="fg"><label>Gender</label>
        <select id="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select>
      </div>
      <div class="fg"><label>Age</label><input type="text" id="age" placeholder="e.g. 26" /></div>
      <div class="fg"><label>Date</label><input type="date" id="rxDate" /></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Medicines / Instructions</div>
    <div id="med-rows">
      <div class="med-row" data-idx="0">
        <select class="med-sel" onchange="onMedSel(this)">
          <option value="">Select medicine&hellip;</option>
          <option>Cap Doxycycline (Doxt-SL) 100 mg</option>
          <option>Cap Isotretinoin (Sotret) 10 mg</option>
          <option>Cap Isotretinoin (Sotret) 20 mg</option>
          <option value="__manual">Type manually&hellip;</option>
        </select>
        <select class="freq-sel">
          <option value="">Frequency</option>
          <option value="once daily">Once daily</option>
          <option value="twice daily">Twice daily</option>
        </select>
        <button class="btn-rm" onclick="rmMed(this)">&times;</button>
      </div>
      <div class="med-manual" id="man-0"><input type="text" placeholder="Type medicine / instruction&hellip;" /></div>
    </div>
    <button class="btn-add" onclick="addMed()">+ Add line</button>
  </div>

  <div class="card">
    <div class="card-title">Additional Notes <span style="font-weight:300;text-transform:none;letter-spacing:0">(optional)</span></div>
    <div class="fg"><textarea id="notes" placeholder="Follow-up in 4 weeks, avoid sun exposure, etc."></textarea></div>
  </div>

  <button class="btn-gen" id="genBtn" onclick="generate()">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/>
    </svg>
    Generate &amp; Download PDF
  </button>
  <div id="status"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const SIG_B64 = 'iVBORw0KGgoAAAANSUhEUgAAAmUAAAC7CAYAAAAkJOlRAABM1ElEQVR4nO3deVRc53k/8O+dfYYZhhl2EIhVG9osS0YSCCG0WJYlL7EdO44dx2m2ujlNcpK2J+1p2v76R0/bOCdtfJqmadIkTRzHTSNrqxYQQohVElpYhBDLsDMDMzD7PvP+/iD3ega0gITEID+fc3Rio1nuvTPx/fIuz8MxxkAIIYQQQhaXaLEPgBBCCCGEUCgjhBBCCIkJFMoIIYQQQmIAhTJCCCGEkBhAoYwQQgghJAZQKCOEEEIIiQEUygghhBBCYgCFMkIIIYSQGEChjBBCCCEkBlAoI4QQQgiJARTKCCGEEEJiAIUyQgghhJAYQKGMEEIIISQGUCgjhBBCCCEkBlAoI4QQQgiJARTKCCGEEEJiAIUyQgghhJAYQKGMEEIIISQGUCgjhBBCCCEkBlAoI4QQQgiJARTKCCGEEEJiAIUyQgghhJAYQKGMEEIIISQGUCgjhBBCCCEkBlAoI4QQQgiJARTKCCGEEEJiAIUyQgghhJAYQKGMEEIIISQGUCgjhBBCCCEkBlAoI4QQQgiJARTKCCGEEEJiAIUyQgghhJAYQKGMEEIIISQGUCgjhBBCCCEkBlAoI4QQQgiJARTKCCGEEEJiAIUyQgghhJAYQKGMEEIIISQGUCgjhBBCCCEkBlAoI4QQQgiJARTKCCGEEEJiAIUyQgghhJAYQKGMEEIIISQGUCgjhBBCCCEkBlAoI4QQQgiJARTKCCGEEEJiAIUyQgghhJAYQKGMEEIIISQGUCgjhBBCCCEkBlAoI4QQQgiJARTKCCGEEEJiAIUyQgghhJAYQKGMEEIIISQGWKIegBBCCCHv/RhjdBNGiF21bDoAAAAASUVORK5CYII=';

let rowIdx = 1;

window.addEventListener('DOMContentLoaded', () => {
  const s = localStorage.getItem('formial_rx_sheet');
  if (s) document.getElementById('sheetUrl').value = s;
  document.getElementById('rxDate').valueAsDate = new Date();
});

document.getElementById('sheetUrl').addEventListener('input', e => {
  if (e.target.value.trim()) localStorage.setItem('formial_rx_sheet', e.target.value.trim());
});

function onMedSel(sel) {
  const idx = sel.closest('.med-row').dataset.idx;
  const m = document.getElementById('man-' + idx);
  if (m) m.classList.toggle('on', sel.value === '__manual');
}

function addMed() {
  const idx = rowIdx++;
  const row = document.createElement('div');
  row.className = 'med-row'; row.dataset.idx = idx;
  row.innerHTML = `
    <select class="med-sel" onchange="onMedSel(this)">
      <option value="">Select medicine&hellip;</option>
      <option>Cap Doxycycline (Doxt-SL) 100 mg</option>
      <option>Cap Isotretinoin (Sotret) 10 mg</option>
      <option>Cap Isotretinoin (Sotret) 20 mg</option>
      <option value="__manual">Type manually&hellip;</option>
    </select>
    <select class="freq-sel">
      <option value="">Frequency</option>
      <option value="once daily">Once daily</option>
      <option value="twice daily">Twice daily</option>
    </select>
    <button class="btn-rm" onclick="rmMed(this)">&times;</button>`;
  const man = document.createElement('div');
  man.className = 'med-manual'; man.id = 'man-' + idx;
  man.innerHTML = `<input type="text" placeholder="Type medicine / instruction&hellip;" />`;
  document.getElementById('med-rows').append(row, man);
}

function rmMed(btn) {
  const row = btn.closest('.med-row');
  const idx = row.dataset.idx;
  const man = document.getElementById('man-' + idx);
  if (document.querySelectorAll('.med-row').length === 1) {
    row.querySelector('.med-sel').value = '';
    row.querySelector('.freq-sel').value = '';
    if (man) { man.classList.remove('on'); man.querySelector('input').value = ''; }
    return;
  }
  row.remove(); if (man) man.remove();
}

function getMeds() {
  const out = [];
  document.querySelectorAll('.med-row').forEach(row => {
    const idx = row.dataset.idx;
    const sel = row.querySelector('.med-sel');
    const freq = row.querySelector('.freq-sel').value;
    let name = sel.value === '__manual'
      ? (document.getElementById('man-' + idx)?.querySelector('input').value.trim() || '')
      : sel.value;
    if (!name) return;
    out.push(freq ? name + ' \u2014 ' + freq : name);
  });
  return out;
}

function setStatus(msg, err) {
  const el = document.getElementById('status');
  el.textContent = msg; el.className = err ? 'err' : '';
}

async function generate() {
  const name     = document.getElementById('patName').value.trim();
  const age      = document.getElementById('age').value.trim();
  const gender   = document.getElementById('gender').value;
  const dateVal  = document.getElementById('rxDate').value;
  const notes    = document.getElementById('notes').value.trim();
  const sheetUrl = document.getElementById('sheetUrl').value.trim();
  const meds     = getMeds();

  if (!name)        { setStatus('Please enter patient name.', true); return; }
  if (!dateVal)     { setStatus('Please select a date.', true); return; }
  if (!meds.length) { setStatus('Please add at least one medicine.', true); return; }

  if (sheetUrl) localStorage.setItem('formial_rx_sheet', sheetUrl);
  const [y, mo, d] = dateVal.split('-');
  const dispDate = `${d}-${mo}-${y}`;

  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  setStatus('Saving to sheet\u2026');

  // Log to sheet FIRST, then generate PDF
  await logSheet({ name, age, gender, date: dispDate, meds, notes, sheetUrl });

  try {
    buildPDF({ name, age, gender, dispDate, meds, notes });
    setStatus('\u2713 PDF downloaded!' + (sheetUrl ? '  Logged to sheet.' : ''));
  } catch(e) {
    setStatus('Error generating PDF: ' + e.message, true);
    console.error(e);
  }
  btn.disabled = false;
}

async function logSheet({ name, age, gender, date, meds, notes, sheetUrl }) {
  if (!sheetUrl || !sheetUrl.startsWith('http')) return;
  const payload = {
    name, age, gender, date,
    medicines: meds.join(' | '),
    notes
  };
  try {
    await fetch(sheetUrl, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
  } catch(e) {
    console.warn('Sheet log failed:', e);
  }
}

function buildPDF({ name, age, gender, dispDate, meds, notes }) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, H = 297, ML = 18, MR = 18, CW = W - ML - MR;
  const C = {
    teal: [26,74,66], teal2: [45,122,111], teal3: [74,171,156],
    sand: [232,220,200], sand2: [245,240,232],
    ink: [28,34,32], muted: [107,124,120], white: [255,255,255],
  };

  // HEADER
  doc.setFillColor(...C.teal);
  doc.rect(0, 0, W, 40, 'F');
  doc.setFillColor(...C.sand);
  doc.triangle(0, 40, 24, 0, 0, 0, 'F');
  doc.triangle(W, 40, W - 24, 0, W, 0, 'F');
  doc.setFont('times', 'italic');
  doc.setFontSize(28);
  doc.setTextColor(...C.white);
  doc.text('formial', W / 2, 22, { align: 'center' });
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(6); doc.setCharSpace(5);
  doc.setTextColor(...C.sand);
  doc.text('LABS', W / 2, 31, { align: 'center' });
  doc.setCharSpace(0);

  // DOCTOR BLOCK
  let cy = 48;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(...C.teal);
  doc.text('Dr. Neha Fogla', ML, cy);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...C.muted);
  cy += 5; doc.text('MBBS, MD (DVL)  \u00b7  Dermatologist  \u00b7  MMC Reg. 2021054683', ML, cy);
  cy += 5;
  doc.setDrawColor(...C.teal3); doc.setLineWidth(0.35);
  doc.line(ML, cy, W - MR, cy);

  // PATIENT STRIP
  cy += 4;
  doc.setFillColor(...C.sand2);
  doc.roundedRect(ML, cy, CW, 22, 2, 2, 'F');
  doc.setFont('times', 'bolditalic'); doc.setFontSize(20); doc.setTextColor(...C.teal);
  doc.text('Rx', ML + 4, cy + 14);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(...C.ink);
  doc.text(name, ML + 19, cy + 10);
  const ageLine = [age && `Age ${age}`, gender || ''].filter(Boolean).join('  \u00b7  ');
  if (ageLine) {
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...C.muted);
    doc.text(ageLine, ML + 19, cy + 17);
  }
  doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(...C.muted);
  doc.text('DATE', W - MR - 2, cy + 9, { align: 'right' });
  doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(...C.teal);
  doc.text(dispDate, W - MR - 2, cy + 17, { align: 'right' });
  cy += 32;

  // MEDICINES
  doc.setFont('helvetica', 'bold'); doc.setFontSize(7); doc.setTextColor(...C.teal3);
  doc.setCharSpace(2); doc.text('PRESCRIBED', ML, cy); doc.setCharSpace(0);
  cy += 3;
  doc.setDrawColor(...C.teal3); doc.setLineWidth(0.4);
  doc.line(ML, cy, ML + 30, cy);
  cy += 9;

  meds.forEach((med, i) => {
    const lines = doc.splitTextToSize(med, CW - 14);
    const rowH = lines.length * 6.5 + 10;
    if (i % 2 === 0) {
      doc.setFillColor(243, 249, 247);
      doc.roundedRect(ML, cy - 5, CW, rowH, 2, 2, 'F');
    }
    doc.setFillColor(...C.teal);
    doc.roundedRect(ML, cy - 3.5, 7, 7, 1.2, 1.2, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(7); doc.setTextColor(...C.white);
    doc.text(`${i+1}`, ML + 3.5, cy + 0.5, { align: 'center' });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5); doc.setTextColor(...C.ink);
    doc.text(lines, ML + 11, cy);
    cy += rowH + 4;
  });

  cy += 14;

  // NOTES
  if (notes) {
    const nl = doc.splitTextToSize(notes, CW - 16);
    const nh = nl.length * 5.5 + 19;
    doc.setFillColor(...C.sand2);
    doc.roundedRect(ML, cy, CW, nh, 3, 3, 'F');
    doc.setFillColor(...C.teal3);
    doc.roundedRect(ML, cy, 3.5, nh, 1.5, 1.5, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(7); doc.setTextColor(...C.teal2);
    doc.setCharSpace(1.5); doc.text('NOTES', ML + 9, cy + 9); doc.setCharSpace(0);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(...C.ink);
    doc.text(nl, ML + 9, cy + 15);
    cy += nh + 8;
  }

  // SIGNATURE
  const sy = Math.max(cy + 12, H - 58);
  doc.setDrawColor(...C.sand); doc.setLineWidth(0.25);
  doc.line(ML, sy, ML + 58, sy);
  try {
    doc.addImage('data:image/png;base64,' + SIG_B64, 'PNG', ML, sy + 3, 48, 16);
  } catch(e) {}
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(...C.teal);
  doc.text('Dr. Neha Fogla', ML, sy + 25);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(...C.muted);
  doc.text('MBBS, MD (DVL)  \u00b7  Dermatologist', ML, sy + 31);

  // SEAL
  const sx = W - MR - 22, scy = sy + 18;
  doc.setDrawColor(...C.teal3); doc.setLineWidth(0.5);
  doc.circle(sx, scy, 16);
  doc.setLineWidth(0.25); doc.circle(sx, scy, 14);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(5.5); doc.setTextColor(...C.teal2);
  doc.setCharSpace(1.2);
  doc.text('FORMIAL', sx, scy - 2, { align: 'center' });
  doc.text('LABS', sx, scy + 4, { align: 'center' });
  doc.setCharSpace(0);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(5); doc.setTextColor(...C.teal3);
  doc.text('BENGALURU', sx, scy + 9, { align: 'center' });

  // FOOTER
  const fy = H - 16;
  doc.setFillColor(...C.teal); doc.rect(0, fy, W, 16, 'F');
  doc.setFillColor(...C.teal2); doc.triangle(0, fy, 26, fy, 0, H, 'F');
  doc.setFont('helvetica', 'normal'); doc.setFontSize(6.5); doc.setTextColor(175, 210, 205);
  doc.text('1ST FLOOR, 181, KBAR ROAD, AUSTIN TOWN, BENGALURU \u2013 560047', W/2, fy+6, { align:'center' });
  doc.setFont('helvetica', 'bold'); doc.setFontSize(7); doc.setTextColor(...C.white);
  doc.text('+91\u00a087928\u00a008844   \u00b7   care@formial.in', W/2, fy+12, { align:'center' });

  doc.save(`Rx_${name.replace(/\s+/g,'_')}_${dispDate.replace(/-/g,'')}.pdf`);
}
</script>
</body>
</html>
